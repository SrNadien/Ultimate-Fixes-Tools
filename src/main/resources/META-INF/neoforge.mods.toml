modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_named}"
    authors="${mod_authors}"
    description = "${mod_description}"
    logoFile = "logo.png"

    [[mods.dependencies.${mod_id}]]
        modId = "neoforge"
        type = "required"
        versionRange = "${neo_version}"
        ordering = "NONE"
        side = "SERVER"

    [[mods.dependencies.${mod_id}]]
        modId = "minecraft"
        type = "required"
        versionRange = "${minecraft_version}"
        ordering = "NONE"
        side = "SERVER"
